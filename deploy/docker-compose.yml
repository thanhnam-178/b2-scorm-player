services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}

  scorm-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: b2-scorm-player-test
    platform: linux/amd64
    ports:
      - "${SCORM_SERVICE_PORT:-8004}:8000"
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    depends_on:
      - db
      - minio

  scorm-content:
    image: nginx:alpine
    ports:
      - "${SCORM_CONTENT_PORT:-8104}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - minio
  
  minio:
    image: pgsty/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

volumes:
  minio_data:
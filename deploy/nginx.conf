server {
    listen 80;
    server_name _;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    location / {
        limit_except GET HEAD { deny all; }
        proxy_pass http://minio:9000/scorm/;
        proxy_hide_header Server;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Content-Security-Policy;
    }
}

server {
    listen 80;
    server_name _;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    # Chuyen noi dung SCORM qua API Content cua SCORM Service.
    location /content/ {
        access_log /var/log/nginx/content-debug.log;
        limit_except GET HEAD { deny all; }

        proxy_pass http://scorm-service:8000/api/v1/content/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header Server;
    }

    # Chuyen tiep Runtime API cho SCORM Adapter.
    location /api/v1/attempts/ {
        proxy_pass http://scorm-service:8000/api/v1/attempts/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header Server;
    }

    # Chuyen tiep file JavaScript Adapter.
    location /static/ {
        limit_except GET HEAD { deny all; }

        proxy_pass http://scorm-service:8000/static/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_hide_header Server;
    }

    # Khong cong khai MinIO truc tiep.
    location / {
        return 404;
    }
}

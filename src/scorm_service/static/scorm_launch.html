
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCORM Player</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        #scorm-content {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }

        #scorm-error {
            padding: 24px;
            font-family: sans-serif;
            color: #b42318;
        }
    </style>
</head>
<body>
    <div id="scorm-error" hidden></div>

    <iframe
        id="scorm-content"
        title="SCORM learning content"
        allow="fullscreen"
    ></iframe>

    <script src="/static/scorm_adapter.js"></script>
    <script>
        (function () {
            "use strict";

            const config = __SCORM_CONFIG__;

            const errorElement = document.getElementById("scorm-error");
            const frame = document.getElementById("scorm-content");

            try {
                if (typeof window.createScormAdapter !== "function") {
                    throw new Error("Khong tai duoc SCORM Adapter");
                }

                const adapter = window.createScormAdapter(config);

                if (config.scormVersion === "1.2") {
                    window.API = adapter;
                } else if (config.scormVersion === "2004") {
                    window.API_1484_11 = adapter;
                } else {
                    throw new Error("Phien ban SCORM khong duoc ho tro");
                }

                frame.src = config.launchUrl;
            } catch (error) {
                frame.hidden = true;
                errorElement.hidden = false;
                errorElement.textContent =
                    "Khong the khoi dong SCORM: " + error.message;
            }
        })();
    </script>
</body>
</html>
